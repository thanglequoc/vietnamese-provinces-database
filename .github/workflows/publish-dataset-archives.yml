name: Publish Dataset Archives

# Packages each published dataset folder into a ZIP archive, uploads the
# archives to the maintainer's Cloudflare R2 bucket, and opens a PR that
# refreshes the download tables in the READMEs / GIS docs.
#
# Run this after the dataset PR is merged and the release tag exists. The
# version is read from `dataset-generation-scripts/version.txt`
# (`dataset_version`), which must match the git tag; that tag is checked out so
# the archives contain the exact released data.
#
# Required repository secrets:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Required repository variables:
#   R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_PUBLIC_BASE_URL
# Optional secret:
#   DECREE_AUTOMATION_PAT — PAT so the generated PR triggers `test-go.yml`
#   (falls back to the default GITHUB_TOKEN, whose PRs do not trigger CI).

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-dataset-archives
  cancel-in-progress: false

jobs:
  package:
    name: Package and upload archives
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tooling
        uses: actions/checkout@v7
        with:
          path: repo
          fetch-depth: 1
          sparse-checkout: .github

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git -C repo show HEAD:dataset-generation-scripts/version.txt \
            | grep -E '^dataset_version=' | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          [[ -n "${VERSION}" ]] || { echo "error: could not read dataset_version from version.txt" >&2; exit 1; }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Checkout dataset at ${{ steps.version.outputs.version }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.version }}
          path: data
          fetch-depth: 1
          sparse-checkout: |
            postgresql
            mysql
            sqlserver
            oracle
            json
            mongodb
            redis
            elasticsearch

      - name: Package datasets
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          ./repo/.github/scripts/package-datasets.sh \
            "${{ steps.version.outputs.version }}" \
            "${RUNNER_TEMP}/archives" \
            --repo-root data

      - name: Upload archives to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          ./repo/.github/scripts/upload-archives-to-r2.sh \
            "${{ steps.version.outputs.version }}" \
            "${RUNNER_TEMP}/archives"

      - name: Write run summary
        run: |
          set -euo pipefail
          MANIFEST="${RUNNER_TEMP}/archives/downloads.json"
          {
            echo "## Dataset archives — $(jq -r .version "${MANIFEST}")"
            echo
            echo "| Dataset | Size | URL |"
            echo "|---------|------|-----|"
            jq -r '.datasets[] | "| \(.id) | \(.size_human) | \(.url) |"' "${MANIFEST}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: downloads-manifest
          path: ${{ runner.temp }}/archives/downloads.json
          if-no-files-found: error

  docs:
    name: Update download tables and open PR
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: Download manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: downloads-manifest
          path: ${{ runner.temp }}/manifest

      - name: Update download tables
        run: |
          python3 .github/scripts/update_download_tables.py \
            --downloads "${RUNNER_TEMP}/manifest/downloads.json" \
            --repo-root .

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DECREE_AUTOMATION_PAT || github.token }}
          base: master
          branch: auto/downloads-${{ needs.package.outputs.version }}
          delete-branch: true
          author: 'vn-provinces-bot <noreply@users.noreply.github.com>'
          committer: 'vn-provinces-bot <noreply@users.noreply.github.com>'
          title: 'chore: publish dataset archives for ${{ needs.package.outputs.version }}'
          commit-message: 'docs: add download links for ${{ needs.package.outputs.version }}'
          add-paths: |
            README.md
            README_vi.md
          body: |
            Automated dataset archive publication for `${{ needs.package.outputs.version }}`.

            - Archives uploaded to Cloudflare R2 under `<version>/<format>/`
            - Download tables refreshed in `README.md` and `README_vi.md`

            Triggered manually via `.github/workflows/publish-dataset-archives.yml`.
