name: Publish Dataset Archives

# Packages each published dataset folder into a ZIP archive, uploads the
# archives to the maintainer's Cloudflare R2 bucket, and opens a PR that
# refreshes the download tables in the READMEs.
#
# Run this AFTER the dataset PR is merged to `master` and BEFORE the release
# tag is created. The version is read from
# `dataset-generation-scripts/version.txt` (`dataset_version`) and is used to
# name the R2 keys, the manifest and the PR branch. The archives themselves are
# packaged from `master`, because the tag does not exist yet at this point: it
# is created last by `.github/workflows/tag-release.yml`, after the download PR
# merges, so the tag points at a commit whose READMEs already link to the
# published archives.
#
# Required repository secrets:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Required repository variables:
#   R2_ACCOUNT_ID, R2_BUCKET_NAME, R2_PUBLIC_BASE_URL
# Optional secret:
#   DECREE_AUTOMATION_PAT — PAT so the generated PR triggers `test-go.yml`
#   (falls back to the default GITHUB_TOKEN, whose PRs do not trigger CI).

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-dataset-archives
  cancel-in-progress: false

jobs:
  package:
    name: Package and upload archives
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}

    steps:
      # The release tag does not exist yet at this stage (it is created last, by
      # tag-release.yml). The dataset PR is already merged, so `master` holds the
      # exact data being released. A single checkout keeps the tooling
      # (`.github`) and the packaged dataset folders on the same commit.
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: |
            .github
            postgresql
            mysql
            sqlserver
            oracle
            json
            mongodb
            redis
            elasticsearch

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git show HEAD:dataset-generation-scripts/version.txt \
            | grep -E '^dataset_version=' | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          [[ -n "${VERSION}" ]] || { echo "error: could not read dataset_version from version.txt" >&2; exit 1; }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version: ${VERSION}"

      - name: Record source commit
        id: source
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "Packaging from master@${COMMIT}"

      - name: Package datasets
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          ./.github/scripts/package-datasets.sh \
            "${{ steps.version.outputs.version }}" \
            "${RUNNER_TEMP}/archives" \
            --repo-root . \
            --source-commit "${{ steps.source.outputs.commit }}"

      - name: Upload archives to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          ./repo/.github/scripts/upload-archives-to-r2.sh \
            "${{ steps.version.outputs.version }}" \
            "${RUNNER_TEMP}/archives"

      - name: Write run summary
        run: |
          set -euo pipefail
          MANIFEST="${RUNNER_TEMP}/archives/downloads.json"
          {
            echo "## Dataset archives — $(jq -r .version "${MANIFEST}")"
            echo
            echo "Packaged from \`master@${{ steps.source.outputs.commit }}\`."
            echo
            echo "| Dataset | Size | URL |"
            echo "|---------|------|-----|"
            jq -r '.datasets[] | "| \(.id) | \(.size_human) | \(.url) |"' "${MANIFEST}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: downloads-manifest
          path: ${{ runner.temp }}/archives/downloads.json
          if-no-files-found: error

  docs:
    name: Update download tables and open PR
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: Download manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: downloads-manifest
          path: ${{ runner.temp }}/manifest

      - name: Update download tables
        run: |
          python3 .github/scripts/update_download_tables.py \
            --downloads "${RUNNER_TEMP}/manifest/downloads.json" \
            --repo-root .

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DECREE_AUTOMATION_PAT || github.token }}
          base: master
          branch: auto/downloads-${{ needs.package.outputs.version }}
          delete-branch: true
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'chore: publish dataset archives for ${{ needs.package.outputs.version }}'
          commit-message: 'docs: add download links for ${{ needs.package.outputs.version }}'
          add-paths: |
            README.md
            README_vi.md
          body: |
            Automated dataset archive publication for `${{ needs.package.outputs.version }}`.

            - Archives packaged from `master@${{ needs.package.outputs.source_commit }}`
            - Archives uploaded to Cloudflare R2 under `<version>/<format>/`
            - Download tables refreshed in `README.md` and `README_vi.md`

            Merge this PR **before** tagging the release (`Tag Release` workflow).
            The tag is created last so it points at a commit whose READMEs already
            link to the published archives.

            Triggered manually via `.github/workflows/publish-dataset-archives.yml`.
